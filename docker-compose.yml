    prompt-logger:
        image: python:3-slim
        volumes:
            - ./data/prompt-logger:/app:ro
            - ./data/logs:/logs
        working_dir: /app
        command: python proxy.py
        ports:
            - 3002:8080
        environment:
            - LLAMA_BACKEND_HOST=llama-cpp
            - LLAMA_BACKEND_PORT=8080
            - PROMPT_LOG_DIR=/logs/prompts
            - LOG_FILTERED=true
            - LOG_FULL_BODY=true
        depends_on:
            - llama-cpp
        restart: unless-stopped
