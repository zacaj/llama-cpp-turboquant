name: llama-cpp-turboquant
services:
    llama-cpp:
        tty: true
        stdin_open: true
        build:
            context: .
            dockerfile: .devops/cuda.Dockerfile
            target: full
            args:
                CUDA_DOCKER_ARCH: "120"
                GIT_COMMIT: "${GIT_COMMIT:-unknown}"
                GIT_COUNT: "${GIT_COUNT:-0}"
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities:
                              - gpu
        # port exposed via prompt-logger proxy; uncomment to bypass proxy:
        # ports:
        #     - 3002:8080
        volumes:
            - /mnt/llm/llama.cpp/models:/models
            - ./data/logs:/logs
            - ./data/cache:/cache
        ipc: host
        restart: unless-stopped
        gpus: all
        runtime: nvidia
        environment:
            - TURBO_AUTO_ASYMMETRIC=0
            - GGML_TQ_NATIVE=1
            # - TURBO_LAYER_ADAPTIVE=1/2
            # - GGML_CUDA_FORCE_MMQ=1
        # ── -ctk / -ctv quick-reference (all entries >90% quality vs f16/f16) ───
        # All speed deltas are vs f16 decode (CUDA); long-ctx = attention-bandwidth-bound regime.
        # type     bpw    size vs f16   accuracy           short ctx   long ctx    notes
        # ------   -----  ------------  -----------------  ----------  ----------  -----------------------------------
        # f16      16.0   100%          reference          —           —           baseline; best for -ctk
        # q8_0      8.0    50%          ~99.9%             ~0%         +3-7%       recommended -ctk; near-lossless
        # q5_1      5.5    34%          ~99%               ~0%         +7-13%      solid -ctk when VRAM tight
        # q4_0      4.0    25%          ~97%               ~0%         +15-25%     standard 4-bit; OK for both sides
        # turbo4   ~4.5    28%          >q4_0 fidelity     -11%        +8-15%      beats q4_0 quality but NOT speed (28% size + dequant overhead); prefer for -ctv
        # turbo3   ~3.5    22%          <1.5% PPL loss     -12%        +12-22%     more compressed than q4_0 → catches up at long ctx; sweet spot -ctv; risky -ctk
        # turbo2   ~2.0    13%          <2% PPL loss†      ~-15%       +25-40%     most compressed; V-side only; Boundary V auto-enables; never -ctk
        #
        # † turbo2: dense models with Boundary V auto-protecting sensitive layers; MoE same flags, per-expert boundary protection auto-engages.
        # Rule: keep -ctk at f16 or q8_0; push compression onto -ctv (turbo4 → turbo3 → turbo2 most aggressive).
        # Turbo* for -ctk is discouraged (README step 6) without prior model-specific quality validation.
        # ────────────────────────────────────────────────────────────────────────────

        # ── Baseline: same settings as llama.cpp, f16 KV (control) ──────────
        # command: >
        #     --server --host 0.0.0.0 --port 8080 --jinja
        #     -lv 3 --log-timestamps --log-colors on
        #     --checkpoint-every-n-tokens 16000
        #     --cache-prompt
        #     -m /models/Qwen3.5-9B-Q4_K_M.gguf
